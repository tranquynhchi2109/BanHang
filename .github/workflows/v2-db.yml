name: BanHang v2 database integration
on:
  push:
    branches:
      - redesign/premium-php-v2
    paths:
      - 'v2/**'
      - '.github/workflows/v2-db.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-db.yml'
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: web_mysqli
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Import SQL using MySQL container client
        run: |
          mysql_container=$(docker ps --filter ancestor=mysql:8 --format '{{.ID}}' | head -n 1)
          test -n "$mysql_container"
          docker exec -i -e MYSQL_PWD=local-ci-only "$mysql_container" mysql -uroot web_mysqli < web_mysqli.sql
          docker exec -i -e MYSQL_PWD=local-ci-only "$mysql_container" mysql -uroot web_mysqli < v2/database_upgrade.sql
      - name: Exercise real PDO data access
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: web_mysqli
          DB_USER: root
          DB_PASS: local-ci-only
        run: |
          php -r 'require "v2/app.php"; $p = rows("SELECT id_sanpham FROM tbl_sanpham LIMIT 1"); if (!$p) { exit(1); } $s = setting("store_name"); if ($s === "") { exit(1); } echo "DB smoke succeeded\n";'

      - name: Smoke test PHP routes over HTTP
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: web_mysqli
          DB_USER: root
          DB_PASS: local-ci-only
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/banhang-http.log 2>&1 &
          sleep 2
          for route in 'v2/index.php' 'v2/index.php?page=products' 'v2/index.php?page=cart' 'v2/index.php?page=register' 'v2/index.php?page=news' 'v2/admin.php?page=login'; do
            status=$(curl -s -o /tmp/v2-page.html -w '%{http_code}' "http://127.0.0.1:8080/$route")
            if [ "$status" != "200" ]; then
              cat /tmp/banhang-http.log
              echo "Route failed: $route returned $status"
              exit 1
            fi
            grep -q '</html>' /tmp/v2-page.html || exit 1
          done

name: PHP and database checks
on:
  push:
    branches:
      - main
      - redesign/premium-mainline
  pull_request:
    branches:
      - main
jobs:
  php-lint:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: web_mysqli
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, mysqli, fileinfo
      - name: Lint active PHP entry points
        run: |
          php -l app.php
          php -l index.php
          php -l pages/header.php
          php -l pages/main.php
          php -l pages/footer.php
          php -l admin/index.php
          php -l admin/config/config.php
      - name: Import legacy schema and run additive migration
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot < web_mysqli.sql
          mysql -h 127.0.0.1 -uroot web_mysqli < database_upgrade.sql
          mysql -h 127.0.0.1 -uroot web_mysqli -e "SHOW COLUMNS FROM v2_order_items LIKE 'variant_label';"
          mysql -h 127.0.0.1 -uroot web_mysqli < bank_config_mbbank.sql
          test "$(mysql -h 127.0.0.1 -uroot -N -s web_mysqli -e "SELECT setting_value FROM v2_settings WHERE setting_key='bank_id'")" = '970422'
          test "$(mysql -h 127.0.0.1 -uroot -N -s web_mysqli -e "SELECT setting_value FROM v2_settings WHERE setting_key='bank_account'")" = '0973258529'

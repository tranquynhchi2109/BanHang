name: BanHang v2 static checks
on:
  push:
    branches:
      - redesign/premium-php-v2
    paths:
      - 'v2/**'
      - '.github/workflows/v2-check.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-check.yml'
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Syntax check (PHP)
        run: find v2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Syntax check (JavaScript)
        run: node --check v2/assets/app.js
      - name: Check for accidental local config commit
        run: test ! -e v2/config.local.php

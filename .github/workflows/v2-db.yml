name: BanHang v2 database integration
on:
  push:
    branches:
      - redesign/premium-php-v2
    paths:
      - 'v2/**'
      - '.github/workflows/v2-db.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-db.yml'
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: web_mysqli
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Install mysql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Import source and migration
        env:
          MYSQL_PWD: local-ci-only
        run: |
          mysql -h127.0.0.1 -uroot web_mysqli < web_mysqli.sql
          mysql -h127.0.0.1 -uroot web_mysqli < v2/database_upgrade.sql
      - name: Exercise real PDO data access
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: web_mysqli
          DB_USER: root
          DB_PASS: local-ci-only
        run: |
          php -r 'require "v2/app.php"; $p = rows("SELECT id_sanpham FROM tbl_sanpham LIMIT 1"); if (!$p) { exit(1); } $s = setting("store_name"); if ($s === "") { exit(1); } echo "DB smoke succeeded\n";'
